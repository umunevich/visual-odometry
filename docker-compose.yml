version: '3.8'

services:
  backend:
    build: 
      context: ./vo-uav
    ports:
      - "8000:8000"
    volumes:
      - ./vo-uav:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: 
      context: ./vo-frontend
    ports:
      - "4200:80"
    volumes:
      - ./vo-frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend